name: Update Fish Market Monitor data

on:
  workflow_dispatch:
  schedule:
    # Monthly on the 11th at 04:00 UTC. Manual runs are available under Actions.
    - cron: '0 4 11 * *'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dart dependencies
        working-directory: MarketMonitor
        run: dart pub get

      - name: Generate annual data
        id: annual
        working-directory: MarketMonitor
        continue-on-error: true
        run: dart run market_monitor.dart

      - name: Generate quarterly data
        id: quarterly
        working-directory: MarketMonitor
        continue-on-error: true
        run: dart run market_monitor_quarterly.dart

      - name: Commit generated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f MarketMonitor/companies.json ]; then git add MarketMonitor/companies.json; fi
          if [ -f MarketMonitor/companies_quarterly.json ]; then git add MarketMonitor/companies_quarterly.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Fish Market Monitor data"
            git push
          else
            echo "No generated data changes to commit."
          fi

      - name: Report parser failures
        if: steps.annual.outcome == 'failure' || steps.quarterly.outcome == 'failure'
        run: |
          echo "At least one parser failed. Any successfully generated JSON file was still committed if changed."
          exit 1
